[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "andrewehki-ttftsplit"
version = "0.1.0"
description = "分解排队、预填充、网络与调度耗时，标出主要贡献项"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "andrewehki" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://andrewehki.github.io"
Repository = "https://github.com/andrewehki/ttftsplit"
Issues = "https://github.com/andrewehki/ttftsplit/issues"

[project.scripts]
ttftsplit = "ttftsplit:main"

[tool.setuptools]
py-modules = ["ttftsplit"]
